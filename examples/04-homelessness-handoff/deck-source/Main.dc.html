  <style>

<div style="width: 1280px; height: 720px; background: #F2E8D5; color: #16211F; position: relative; overflow: hidden; display: flex;">

      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #7C7565;">Challenge 4 &middot; Homelessness handoff</span>

  <div style="flex: 0 0 470px; position: relative;">
    <img src="illo-street.jpg" alt="Empty sunlit sidewalk beside a shuttered storefront, heat rising from the pavement" style="width: 100%; height: 100%; object-fit: cover; display: block;">
    <div style="position: absolute; inset: 0; background: linear-gradient(to right, #F2E8D5 0%, rgba(242,232,213,0) 22%);"></div>
  </div>

</div>
